  push:
    branches:
      - "feature/multi-model-task-router"
      - "feature/jarvis-capability-pack"
      - "feature/focus-aware-desktop-context"
      - "feature/local-ui-vision"
      - "feature/verified-ui-actions"
      - "feature/verified-ui-sequences"
      - "feature/verified-ui-forms-rebased"
      - "feature/verified-dropdown-selection"
      - "feature/verified-calendar-date-selection"
      - "feature/verified-time-field-entry"
      - "feature/ui-picker-diagnostics"
      - "feature/verified-spinner-value-rebased"
      - "feature/verified-checkbox-state-rebased"
      - "feature/verified-radio-selection-rebased"
      - "feature/verified-tab-selection-rebased"
      - "feature/verified-list-selection-rebased"
      - "feature/verified-slider-control"
      - "feature/verified-tree-navigation"
      - "feature/ui-reasoning-engine"
      - "feature/mission-control-reliability-tests"

jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight offline test dependency
        run: python -m pip install numpy
      - name: Compile changed Python modules
        run: |
          python -m py_compile actions/ui_spinner.py core/_ui_spinner_tests.py actions/ui_slider.py core/_ui_slider_tests.py actions/ui_tree.py core/_ui_tree_tests.py actions/ui_checkbox.py core/_ui_checkbox_tests.py actions/ui_radio.py core/_ui_radio_tests.py actions/ui_tab.py core/_ui_tab_tests.py actions/ui_list.py core/_ui_list_tests.py core/model_router.py core/gemini.py core/_model_router_tests.py core/_capability_tests.py core/_proactive_tests.py actions/proactive.py core/echo.py core/desktop_context.py core/_desktop_context_tests.py core/wake_word.py core/_wake_word_tests.py core/appidentity.py core/_appidentity_tests.py core/communication_context.py core/_communication_context_tests.py actions/screen_understanding.py core/_screen_understanding_tests.py actions/ui_interaction.py actions/ui_reasoning.py core/ui_reasoning.py core/_ui_reasoning_tests.py core/_ui_interaction_tests.py core/_ui_interaction_windows_tests.py actions/ui_sequence.py core/_ui_sequence_tests.py actions/ui_dropdown.py core/_ui_dropdown_tests.py actions/ui_calendar.py core/_ui_calendar_tests.py actions/ui_time.py core/_ui_time_tests.py actions/ui_picker_diagnostics.py core/_ui_picker_diagnostics_tests.py core/confirm.py core/_confirm_tests.py memory/config_manager.py memory/conversation_history.py providers/llm_openai.py plugins/conversation_history.py plugins/mission_control.py plugins/_mission_control_tests.py plugins/knowledge_vault.py plugins/_knowledge_vault_tests.py ui.py main.py actions/dev_agent.py actions/_dev_agent_safety_tests.py memory/memory_manager.py memory/_tests.py core/stt.py core/_stt_tests.py actions/background_monitor.py actions/_background_monitor_tests.py actions/send_message.py actions/_send_message_tests.py actions/open_app.py actions/_open_app_tests.py actions/browser_control.py actions/_browser_control_tests.py actions/computer_control.py actions/_computer_control_safety_tests.py actions/file_controller.py actions/_file_controller_tests.py core/browser_safety.py core/_browser_safety_tests.py core/autonomy_policy.py core/_autonomy_policy_tests.py core/mission_evidence.py core/_mission_evidence_tests.py core/engine_policy.py core/_engine_policy_tests.py dashboard/server.py core/dashboard_policy.py core/_dashboard_policy_tests.py core/dashboard_auth_policy.py core/_dashboard_auth_tests.py core/dashboard_upload_policy.py core/_dashboard_upload_tests.py core/execution_policy.py core/_execution_policy_tests.py core/code_checks.py core/project_path_policy.py core/_project_path_policy_tests.py core/project_env.py core/_project_env_tests.py core/project_plan.py core/_project_plan_tests.py core/timeout_policy.py core/_timeout_policy_tests.py core/process_runner.py core/_process_runner_tests.py core/safe_file_write.py core/_safe_file_write_tests.py actions/code_helper.py
      - name: Run offline router tests
        run: python -m core._model_router_tests
      - name: Run fail-closed engine policy tests
        run: python -m core._engine_policy_tests
      - name: Run dashboard network policy tests
        run: python -m core._dashboard_policy_tests
      - name: Run dashboard upload quota tests
        run: python -m core._dashboard_upload_tests
      - name: Run dashboard session auth tests
        run: python -m core._dashboard_auth_tests
      - name: Run code execution confirmation policy tests
        run: python -m core._execution_policy_tests
      - name: Run project file path boundary tests
        run: python -m core._project_path_policy_tests
      - name: Run isolated project environment tests
        run: python -m core._project_env_tests
      - name: Run project plan validation tests
        run: python -m core._project_plan_tests
      - name: Run bounded execution timeout tests
        run: python -m core._timeout_policy_tests
      - name: Run bounded process runner tests
        run: python -m core._process_runner_tests
      - name: Run offline dev-agent launch safety tests
        run: python -m actions._dev_agent_safety_tests
      - name: Run safe code-file write and undo tests
        run: python -m core._safe_file_write_tests
      - name: Run offline capability tests
        run: python -m core._capability_tests
      - name: Run offline proactive tests
        run: python -m core._proactive_tests
      - name: Run offline desktop context tests
        run: python -m core._desktop_context_tests
      - name: Run bounded wake-word installation tests
        run: python -m core._wake_word_tests
      - name: Run application process identity tests
        run: python -m core._appidentity_tests
      - name: Run communication microphone privacy tests
        run: python -m core._communication_context_tests
      - name: Run offline screen understanding tests
        run: python -m core._screen_understanding_tests
      - name: Run offline UI interaction tests
        run: python -m core._ui_interaction_tests
      - name: Run confirmation lifecycle tests
        run: python -m core._confirm_tests
      - name: Run verified UI sequence tests
        run: python -m core._ui_sequence_tests
      - name: Run verified dropdown selection tests
        run: python -m core._ui_dropdown_tests
      - name: Run verified calendar date tests
        run: python -m core._ui_calendar_tests
      - name: Run verified time-field tests
        run: python -m core._ui_time_tests
      - name: Run picker diagnostics tests
        run: python -m core._ui_picker_diagnostics_tests
      - name: Run verified Spinner tests
        run: python -m core._ui_spinner_tests
      - name: Run verified Checkbox tests
        run: python -m core._ui_checkbox_tests
      - name: Run verified RadioButton tests
        run: python -m core._ui_radio_tests
      - name: Run verified TabItem tests
        run: python -m core._ui_tab_tests
      - name: Run verified single-selection List tests
        run: python -m core._ui_list_tests
      - name: Run verified Slider tests
        run: python -m core._ui_slider_tests
      - name: Run verified TreeItem tests
        run: python -m core._ui_tree_tests
      - name: Run UI reasoning planner tests
        run: python -m core._ui_reasoning_tests
      - name: Run Mission Control reliability tests
        run: python -m plugins._mission_control_tests
      - name: Run mission evidence binding tests
        run: python -m core._mission_evidence_tests
      - name: Run outbound message confirmation tests
        run: python -m actions._send_message_tests
      - name: Run autonomy and minimal-confirmation policy tests
        run: python -m core._autonomy_policy_tests
      - name: Run browser safety classifier tests
        run: python -m core._browser_safety_tests
      - name: Run browser behavior safety tests
        run: python -m actions._browser_control_tests
      - name: Run cross-platform application launcher tests
        run: python -m actions._open_app_tests
      - name: Run desktop-control safety tests
        run: python -m actions._computer_control_safety_tests
      - name: Run file-controller untrusted data tests
        run: python -m actions._file_controller_tests
      - name: Run memory store reliability tests
        run: python -m memory._tests
      - name: Run Knowledge Vault Undo safety tests
        run: python -m plugins._knowledge_vault_tests
      - name: Run background monitor reliability tests
        run: python -m actions._background_monitor_tests
      - name: Run Whisper device policy tests
        run: python -m core._stt_tests
      - name: Run TTS device policy tests
        run: python -m core._tts_resource_tests

  windows-uia:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Windows UI Automation dependencies
        run: python -m pip install pywinauto pywin32
      - name: Compile UI Automation modules
        run: python -m py_compile actions/ui_spinner.py core/_ui_spinner_tests.py actions/ui_slider.py core/_ui_slider_tests.py actions/ui_checkbox.py core/_ui_checkbox_tests.py actions/ui_radio.py core/_ui_radio_tests.py actions/ui_tab.py core/_ui_tab_tests.py actions/ui_list.py core/_ui_list_tests.py core/communication_context.py core/_communication_context_tests.py actions/screen_understanding.py actions/ui_interaction.py actions/ui_reasoning.py core/ui_reasoning.py core/_ui_reasoning_tests.py actions/ui_sequence.py actions/ui_dropdown.py core/_ui_dropdown_tests.py actions/ui_calendar.py core/_ui_calendar_tests.py actions/ui_time.py core/_ui_time_tests.py actions/ui_picker_diagnostics.py core/_ui_picker_diagnostics_tests.py core/confirm.py core/_screen_understanding_tests.py core/_ui_interaction_tests.py core/_ui_interaction_windows_tests.py core/_confirm_tests.py core/_ui_sequence_tests.py core/project_env.py core/_project_env_tests.py core/project_plan.py core/_project_plan_tests.py core/timeout_policy.py core/_timeout_policy_tests.py core/process_runner.py core/_process_runner_tests.py core/safe_file_write.py core/_safe_file_write_tests.py actions/dev_agent.py actions/_dev_agent_safety_tests.py actions/computer_control.py actions/_computer_control_safety_tests.py actions/file_controller.py actions/_file_controller_tests.py actions/code_helper.py core/autonomy_policy.py core/_autonomy_policy_tests.py core/tts.py core/tts_resource_policy.py core/_tts_resource_tests.py
      - name: Run native Windows UI Automation integration tests
        run: python -m core._ui_interaction_windows_tests
      - name: Run isolated project environment tests on Windows
        run: python -m core._project_env_tests
      - name: Run project plan validation tests on Windows
        run: python -m core._project_plan_tests
      - name: Run bounded execution timeout tests on Windows
        run: python -m core._timeout_policy_tests
      - name: Run bounded process runner tests on Windows
        run: python -m core._process_runner_tests
      - name: Run safe code-file write and undo tests on Windows
        run: python -m core._safe_file_write_tests
      - name: Run dev-agent safety tests on Windows
        run: python -m actions._dev_agent_safety_tests
      - name: Run desktop-control safety tests on Windows
        run: python -m actions._computer_control_safety_tests
      - name: Run file-controller untrusted data tests on Windows
        run: python -m actions._file_controller_tests
