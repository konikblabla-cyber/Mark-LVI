      - "setup.py"
      - "core/model_router.py"
      - "dashboard/server.py"
      - "dashboard/static/app.html"
      - "core/dashboard_auth_policy.py"
      - "core/_dashboard_auth_tests.py"
      - "core/dashboard_upload_policy.py"
      - "core/_dashboard_upload_tests.py"
      - "core/gemini.py"
      - "core/_model_router_tests.py"
      - "core/_capability_tests.py"
      - "core/echo.py"
      - "core/desktop_context.py"
      - "core/_desktop_context_tests.py"
      - "core/wake_word.py"
      - "core/_wake_word_tests.py"
      - "core/appidentity.py"
      - "core/_appidentity_tests.py"
      - "core/communication_context.py"
      - "core/_communication_context_tests.py"
      - "actions/screen_understanding.py"
      - "core/_screen_understanding_tests.py"
      - "actions/ui_interaction.py"
