      - "actions/ui_dropdown.py"
      - "actions/ui_calendar.py"
      - "actions/ui_time.py"
      - "actions/ui_picker_diagnostics.py"
      - "actions/ui_spinner.py"
      - "core/_ui_spinner_tests.py"
      - "core/_ui_checkbox_tests.py"
      - "actions/ui_checkbox.py"
      - "core/_ui_radio_tests.py"
      - "actions/ui_radio.py"
      - "core/_ui_tab_tests.py"
      - "actions/ui_tab.py"
      - "core/_ui_list_tests.py"
      - "actions/ui_list.py"
      - "core/_ui_dropdown_tests.py"
      - "core/_ui_calendar_tests.py"
      - "core/_ui_time_tests.py"
      - "core/_ui_picker_diagnostics_tests.py"
      - "core/_ui_spinner_tests.py"
      - "core/_ui_interaction_tests.py"
      - "core/_ui_interaction_windows_tests.py"
      - "core/confirm.py"
      - "core/_confirm_tests.py"
      - "actions/ui_sequence.py"
      - "core/_ui_sequence_tests.py"
      - "memory/conversation_history.py"
      - "plugins/conversation_history.py"
      - "plugins/mission_control.py"
