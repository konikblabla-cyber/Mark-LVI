name: Model router checks

on:
  pull_request:
    paths:
      - "core/model_router.py"
      - "core/gemini.py"
      - "core/_model_router_tests.py"
      - "core/_capability_tests.py"
      - "core/echo.py"
      - "core/desktop_context.py"
      - "core/_desktop_context_tests.py"
      - "actions/screen_understanding.py"
      - "core/_screen_understanding_tests.py"
      - "actions/ui_interaction.py"
      - "actions/ui_dropdown.py"
      - "actions/ui_calendar.py"
      - "actions/ui_time.py"
      - "actions/ui_picker_diagnostics.py"
      - "actions/ui_spinner.py"
      - "actions/ui_checkbox.py"
      - "actions/ui_radio.py"
      - "actions/ui_tab.py"
      - "core/_ui_dropdown_tests.py"
      - "core/_ui_calendar_tests.py"
      - "core/_ui_time_tests.py"
      - "core/_ui_picker_diagnostics_tests.py"
      - "core/_ui_spinner_tests.py"
      - "core/_ui_checkbox_tests.py"
      - "core/_ui_radio_tests.py"
      - "core/_ui_tab_tests.py"
      - "core/_ui_interaction_tests.py"
      - "core/_ui_interaction_windows_tests.py"
      - "core/confirm.py"
      - "core/_confirm_tests.py"
      - "actions/ui_sequence.py"
      - "core/_ui_sequence_tests.py"
      - "memory/conversation_history.py"
      - "plugins/conversation_history.py"
      - "plugins/mission_control.py"
      - "core/prompt.txt"
      - "plugins/knowledge_vault.py"
      - "memory/config_manager.py"
      - "providers/llm_openai.py"
      - "ui.py"
      - "main.py"
      - "actions/dev_agent.py"
      - "actions/proactive.py"
      - "core/_proactive_tests.py"
      - ".github/workflows/model-router.yml"
  push:
    branches:
      - "feature/multi-model-task-router"
      - "feature/jarvis-capability-pack"
      - "feature/focus-aware-desktop-context"
      - "feature/local-ui-vision"
      - "feature/verified-ui-actions"
      - "feature/verified-ui-sequences"
      - "feature/verified-ui-forms-rebased"
      - "feature/verified-dropdown-selection"
      - "feature/verified-calendar-date-selection"
      - "feature/verified-time-field-entry"
      - "feature/ui-picker-diagnostics"
      - "feature/verified-spinner-value"
      - "feature/verified-checkbox-state"
      - "feature/verified-radio-selection"
      - "feature/verified-tab-selection"

jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight offline test dependency
        run: python -m pip install numpy
      - name: Compile changed Python modules
        run: |
          python -m py_compile core/model_router.py core/gemini.py core/_model_router_tests.py core/_capability_tests.py core/_proactive_tests.py actions/proactive.py core/echo.py core/desktop_context.py core/_desktop_context_tests.py actions/screen_understanding.py core/_screen_understanding_tests.py actions/ui_interaction.py core/_ui_interaction_tests.py core/_ui_interaction_windows_tests.py actions/ui_sequence.py core/_ui_sequence_tests.py actions/ui_dropdown.py core/_ui_dropdown_tests.py actions/ui_calendar.py core/_ui_calendar_tests.py actions/ui_time.py core/_ui_time_tests.py actions/ui_picker_diagnostics.py core/_ui_picker_diagnostics_tests.py actions/ui_spinner.py core/_ui_spinner_tests.py actions/ui_checkbox.py core/_ui_checkbox_tests.py actions/ui_radio.py core/_ui_radio_tests.py actions/ui_tab.py core/_ui_tab_tests.py core/confirm.py core/_confirm_tests.py memory/config_manager.py memory/conversation_history.py providers/llm_openai.py plugins/conversation_history.py plugins/mission_control.py plugins/knowledge_vault.py ui.py main.py actions/dev_agent.py
      - name: Run offline router tests
        run: python -m core._model_router_tests
      - name: Run offline capability tests
        run: python -m core._capability_tests
      - name: Run offline proactive tests
        run: python -m core._proactive_tests
      - name: Run offline desktop context tests
        run: python -m core._desktop_context_tests
      - name: Run offline screen understanding tests
        run: python -m core._screen_understanding_tests
      - name: Run offline UI interaction tests
        run: python -m core._ui_interaction_tests
      - name: Run confirmation lifecycle tests
        run: python -m core._confirm_tests
      - name: Run verified UI sequence tests
        run: python -m core._ui_sequence_tests
      - name: Run verified dropdown selection tests
        run: python -m core._ui_dropdown_tests
      - name: Run verified calendar date tests
        run: python -m core._ui_calendar_tests
      - name: Run verified time-field tests
        run: python -m core._ui_time_tests
      - name: Run picker diagnostics tests
        run: python -m core._ui_picker_diagnostics_tests
      - name: Run verified Spinner tests
        run: python -m core._ui_spinner_tests
      - name: Run verified checkbox tests
        run: python -m core._ui_checkbox_tests
      - name: Run verified radio tests
        run: python -m core._ui_radio_tests
      - name: Run verified tab tests
        run: python -m core._ui_tab_tests

  windows-uia:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Windows UI Automation dependencies
        run: python -m pip install pywinauto pywin32
      - name: Compile UI Automation modules
        run: python -m py_compile actions/screen_understanding.py actions/ui_interaction.py actions/ui_sequence.py actions/ui_dropdown.py core/_ui_dropdown_tests.py actions/ui_calendar.py core/_ui_calendar_tests.py actions/ui_time.py core/_ui_time_tests.py actions/ui_picker_diagnostics.py core/_ui_picker_diagnostics_tests.py actions/ui_spinner.py core/_ui_spinner_tests.py actions/ui_checkbox.py core/_ui_checkbox_tests.py actions/ui_radio.py core/_ui_radio_tests.py actions/ui_tab.py core/_ui_tab_tests.py core/confirm.py core/_screen_understanding_tests.py core/_ui_interaction_tests.py core/_ui_interaction_windows_tests.py core/_confirm_tests.py core/_ui_sequence_tests.py
      - name: Run native Windows UI Automation integration tests
        run: python -m core._ui_interaction_windows_tests
