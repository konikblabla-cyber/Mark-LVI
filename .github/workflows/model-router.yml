      - "core/prompt.txt"
      - "plugins/knowledge_vault.py"
      - "plugins/_knowledge_vault_tests.py"
      - "memory/config_manager.py"
      - "memory/memory_manager.py"
      - "memory/_tests.py"
      - "core/stt.py"
      - "core/_stt_tests.py"
      - "core/tts.py"
      - "core/tts_resource_policy.py"
      - "core/_tts_resource_tests.py"
      - "actions/background_monitor.py"
      - "actions/_background_monitor_tests.py"
      - "providers/llm_openai.py"
      - "ui.py"
      - "main.py"
      - "actions/dev_agent.py"
      - "actions/_dev_agent_safety_tests.py"
      - "actions/send_message.py"
      - "actions/_send_message_tests.py"
      - "actions/open_app.py"
      - "actions/_open_app_tests.py"
      - "actions/browser_control.py"
      - "actions/_browser_control_tests.py"
      - "actions/computer_control.py"
      - "actions/file_controller.py"
      - "actions/_file_controller_tests.py"
      - "actions/_computer_control_safety_tests.py"
      - "core/browser_safety.py"
      - "core/autonomy_policy.py"
      - "core/_autonomy_policy_tests.py"
      - "core/mission_evidence.py"
      - "core/project_path_policy.py"
      - "core/code_checks.py"
      - "core/project_env.py"
      - "core/project_plan.py"
      - "core/timeout_policy.py"
      - "core/process_runner.py"
      - "core/_process_runner_tests.py"
      - "core/_timeout_policy_tests.py"
      - "core/_project_plan_tests.py"
      - "core/safe_file_write.py"
      - "core/_safe_file_write_tests.py"
      - "actions/code_helper.py"
      - "core/_project_env_tests.py"
      - "core/_project_path_policy_tests.py"
      - "core/_mission_evidence_tests.py"
      - "core/_browser_safety_tests.py"
      - "actions/proactive.py"
      - "core/_proactive_tests.py"
