name: Model router checks

on:
  pull_request:
    paths:
      - "core/model_router.py"
      - "core/gemini.py"
      - "core/_model_router_tests.py"
      - "core/_capability_tests.py"
      - "core/_calendar_tests.py"
      - "plugins/google_calendar.py"
      - "core/echo.py"
      - "memory/conversation_history.py"
      - "plugins/conversation_history.py"
      - "plugins/mission_control.py"
      - "plugins/knowledge_vault.py"
      - "memory/config_manager.py"
      - "providers/llm_openai.py"
      - "ui.py"
      - "main.py"
      - "actions/dev_agent.py"
      - ".github/workflows/model-router.yml"
  push:
    branches:
      - "feature/multi-model-task-router"
      - "feature/jarvis-capability-pack"
      - "feature/google-calendar-local-oauth"

jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight offline test dependency
        run: python -m pip install numpy
      - name: Compile changed Python modules
        run: |
          python -m py_compile core/model_router.py core/gemini.py core/_model_router_tests.py core/_capability_tests.py core/_calendar_tests.py core/echo.py memory/config_manager.py memory/conversation_history.py providers/llm_openai.py plugins/conversation_history.py plugins/mission_control.py plugins/knowledge_vault.py plugins/google_calendar.py ui.py main.py actions/dev_agent.py
      - name: Run offline router tests
        run: python -m core._model_router_tests
      - name: Run offline capability tests
        run: python -m core._capability_tests
      - name: Run offline Google Calendar tests
        run: python -m core._calendar_tests
