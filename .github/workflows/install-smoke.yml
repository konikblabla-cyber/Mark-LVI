name: Install smoke checks

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/install-smoke.yml"
      - "core/_browser_runtime_smoke.py"
      - "core/_ui_runtime_smoke.py"

jobs:
  install:
    name: Install dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install the declared runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install headless Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install headless Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Launch Chromium and render a local page
        run: python -m core._browser_runtime_smoke
      - name: Check for broken or conflicting dependencies
        run: python -m pip check
      - name: Install PortAudio runtime for Linux sounddevice
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2 libegl1 gnome-screenshot scrot python3-tk xclip xvfb
      - name: Verify the Linux Qt EGL runtime
        if: runner.os == 'Linux'
        run: python -c "from setup import _check_linux_qt_runtime; _check_linux_qt_runtime()"
      - name: Verify the installer detects the audio runtime
        run: python -c "from setup import _check_linux_portaudio; _check_linux_portaudio()"
      - name: Smoke-test Linux X11 input and screenshot dependencies
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import pyautogui, pyperclip, mss; image = pyautogui.screenshot(); print('PyAutoGUI screenshot:', image.size); pyperclip.copy('jarvis-smoke-test'); assert pyperclip.paste() == 'jarvis-smoke-test'"
      - name: Smoke-test Windows and macOS desktop-control imports
        if: runner.os != 'Linux'
        run: python -c "import pyautogui, pyperclip, mss; print('PyAutoGUI screen:', pyautogui.size())"
      - name: Verify the PortAudio runtime can be loaded
        run: python -c "import sounddevice as sd; version = sd.get_portaudio_version(); print('PortAudio:', version); assert version is not None"
      - name: Create and paint an offscreen Qt window
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -c "from PyQt6.QtWidgets import QApplication, QWidget;
          app = QApplication([]); window = QWidget(); window.resize(800, 600);
          window.show(); app.processEvents(); assert window.isVisible();
          window.close(); app.processEvents(); print('Qt offscreen window OK')"
      - name: Import core runtime dependencies
        run: >-
          python -c "import PyQt6.QtCore, sounddevice, numpy, google.genai,
          httpx, requests, bs4, playwright, PIL, cv2, psutil, send2trash,
          pptx, fastapi, uvicorn, cryptography, multipart, qrcode, ddgs,
          pdfplumber, PyPDF2, docx, pynvml, googleapiclient.discovery,
          google_auth_oauthlib.flow, tinytuya, paho.mqtt.client, openpyxl,
          youtube_transcript_api"
      - name: Import the JARVIS application entry point
        run: python -c "import main; print('JARVIS application entry point imported successfully')"
      - name: Verify Windows audio and UI dependencies
        if: runner.os == 'Windows'
        run: >-
          python -c "import comtypes, pycaw.pycaw, win32api, win32gui,
          win32com.client, wmi, pywinauto, pygetwindow, win10toast"
      - name: Construct and paint the JARVIS HUD offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m core._ui_runtime_smoke
