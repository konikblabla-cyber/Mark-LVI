name: Windows downloadable package

on:
  push:
    branches:
      - feature/gemini-38-live-jarvis
    paths:
      - "START_MARK.bat"
      - "START_MARK.ps1"
      - "INSTALL_MARK.bat"
      - "readme.md"
      - "setup.py"
      - "requirements.txt"
      - "main.py"
      - "ui.py"
      - "core/**"
      - "actions/**"
      - "plugins/**"
      - "memory/**"
      - "config/**"
      - ".github/workflows/windows-download.yml"
  pull_request:
    paths:
      - "START_MARK.bat"
      - "START_MARK.ps1"
      - "INSTALL_MARK.bat"
      - "readme.md"
      - "setup.py"
      - "requirements.txt"
      - ".github/workflows/windows-download.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out MARK
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exercise the first-run Windows installer
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$PWD\START_MARK.ps1" -InstallOnly
          if ($LASTEXITCODE -ne 0) {
            throw "START_MARK.ps1 -InstallOnly failed with exit code $LASTEXITCODE."
          }
          $venvPython = "$PWD\.venv\Scripts\python.exe"
          if (-not (Test-Path $venvPython)) {
            throw "The first-run installer did not create its private Python environment."
          }
          & $venvPython -c "import main; import plugins.google_workspace; print('JARVIS entry point and Google Workspace plugin imported after one-click setup.')"
          if ($LASTEXITCODE -ne 0) {
            throw "The installed JARVIS entry point or Google Workspace plugin failed to import."
          }
          & $venvPython -m plugins._google_workspace_tests
          if ($LASTEXITCODE -ne 0) {
            throw "Google Workspace offline security/behavior tests failed in the installed venv."
          }

      - name: Validate launcher syntax and required files
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\START_MARK.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $required = @(
            "START_MARK.bat", "START_MARK.ps1", "INSTALL_MARK.bat",
            "setup.py", "requirements.txt", "main.py", "ui.py",
            "core\face_model.obj", "core\prompt.txt"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) {
              throw "Required release file is missing: $item"
            }
          }
          if (Test-Path "config\api_keys.json") {
            throw "Refusing to package config\api_keys.json (may contain API credentials)."
          }
          if (Test-Path "config\client_secret_google_workspace.json") {
            throw "Refusing to package the Google Workspace OAuth client secret."
          }
          Write-Host "Launcher syntax and release contents OK."

      - name: Build clean source ZIP
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\MARK-LVI-Windows.zip"
          git archive --format=zip --output="$archive" HEAD
          if (-not (Test-Path $archive)) {
            throw "The Windows ZIP was not created."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @("START_MARK.bat", "START_MARK.ps1", "INSTALL_MARK.bat", "main.py", "setup.py")) {
              if ($names -notcontains $required) {
                throw "The ZIP is missing $required."
              }
            }
            $forbidden = @($names | Where-Object {
              $_ -eq "config/api_keys.json" -or
              $_ -eq "config/client_secret_google_workspace.json" -or
              $_ -match "(^|/)(token[^/]*\.json|client_secret[^/]*\.json)$" -or
              $_ -match "(^|/)\.env($|\.)"
            })
            if ($forbidden.Count -gt 0) {
              throw ("The ZIP contains forbidden credentials: " + ($forbidden -join ", "))
            }
            Write-Host ("Validated ZIP entries: " + $names.Count)
          }
          finally {
            $zip.Dispose()
          }

      - name: Upload downloadable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MARK-LVI-Windows-Portable
          path: ${{ runner.temp }}/MARK-LVI-Windows.zip
          if-no-files-found: error
          retention-days: 30
